name: Plugin update release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-update-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check PHP syntax
        run: find src/so-short-code -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Install locked dependencies
        run: composer install --working-dir=src/so-short-code --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative
      - name: Determine version
        id: version
        run: |
          python scripts/next_github_release.py
      - name: Build ZIP
        if: steps.version.outputs.skip != 'true'
        run: python scripts/build_github_release.py --version "${{ steps.version.outputs.version }}" --output .local/release
      - name: Verify ZIP
        if: steps.version.outputs.skip != 'true'
        run: python scripts/verify_github_release.py --version "${{ steps.version.outputs.version }}" --package .local/release/*.zip
      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        run: gh release create "${{ steps.version.outputs.tag }}" .local/release/*.zip --target "$GITHUB_SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes
